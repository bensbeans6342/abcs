<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      color: #333;
    }

    .controls {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    select, button {
      padding: 8px 16px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .display-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .letter-heading {
      font-size: 3.5rem;
      font-weight: bold;
      margin: 0;
      color: #007bff;
    }

    .item-title {
      font-size: 2rem;
      margin: 0;
      color: #222;
    }

    .item-description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
    }

    .item-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label for="letterSelect"><strong>Select a letter:</strong> </label>
    <select id="letterSelect">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
      <option value="H">H</option>
      <option value="I">I</option>
      <option value="J">J</option>
      <option value="K">K</option>
      <option value="L">L</option>
      <option value="M">M</option>
      <option value="N">N</option>
      <option value="O">O</option>
      <option value="P">P</option>
      <option value="Q">Q</option>
      <option value="R">R</option>
      <option value="S">S</option>
      <option value="T">T</option>
      <option value="U">U</option>
      <option value="V">V</option>
      <option value="W">W</option>
      <option value="X">X</option>
      <option value="Y">Y</option>
      <option value="Z">Z</option>
    </select>
    <button id="goBtn">GO!</button>
  </div>

  <div class="display-container">
    <h1 id="displayLetter" class="letter-heading"></h1>
    <h2 id="displayName" class="item-title"></h2>
    <p id="displayDescription" class="item-description"></p>
    <img id="displayImage" class="item-image" src="" alt="" />
  </div>

  <script>
    const letterData = {
      'A': { name: '', description: '' },
      'B': { name: '', description: '' },
      'C': { name: '', description: '' },
      'D': { name: '', description: '' },
      'E': { name: '', description: '' },
      'F': { name: '', description: '' },
      'G': { name: '', description: '' },
      'H': { name: '', description: '' },
      'I': { name: '', description: '' },
      'J': { name: '', description: '' },
      'K': { name: '', description: '' },
      'L': { name: '', description: '' },
      'M': { name: '', description: '' },
      'N': { name: '', description: '' },
      'O': { name: '', description: '' },
      'P': { name: '', description: '' },
      'Q': { name: '', description: '' },
      'R': { name: '', description: '' },
      'S': { name: '', description: '' },
      'T': { name: '', description: '' },
      'U': { name: '', description: '' },
      'V': { name: '', description: '' },
      'W': { name: '', description: '' },
      'X': { name: '', description: '' },
      'Y': { name: 'Yellow River', description: 'The Yellow River is a river in Northern China that was important to the Shang Dynasty because it provided fertile soil and water for agriculture. It helped the people grow crops and develop their civilizations, but it often flooded, destroying the civilizations along its banks.' },
      'Z': { name: '', description: '' }
    };

    const selectEl = document.getElementById('letterSelect');
    const goBtn = document.getElementById('goBtn');

    goBtn.addEventListener('click', () => {
      const selected = selectEl.value;
      const data = letterData[selected];

      if (data) {
        document.getElementById('displayLetter').textContent = selected;
        document.getElementById('displayName').textContent = data.name;
        document.getElementById('displayDescription').textContent = data.description;
        
        const imageFileName = `${selected.toLowerCase()}.jpg`;
        document.getElementById('displayImage').src = imageFileName;
        document.getElementById('displayImage').alt = data.name;
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works Cited - Ancient Civilizations ABCs</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --heading-color: #007bff;
      --subtext-color: #555555;
      --border-color: #ddd;
      --controls-bg: #fff;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --heading-color: #4dabf7;
      --subtext-color: #b0b0b0;
      --border-color: #333333;
      --controls-bg: #1e1e1e;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      transition: background-color 0.3s, color 0.3s;
    }

    .nav-btn {
      padding: 8px 16px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #007bff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 30px;
    }

    .nav-btn:hover {
      background-color: #0056b3;
    }

    h1 {
      color: var(--heading-color);
    }

    .citation-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
      line-height: 1.6;
    }

    .citation-item {
      padding-left: 2em;
      text-indent: -2em;
      color: var(--subtext-color);
    }

    .footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <a href="index.html" class="nav-btn">&larr; Back to Main Page</a>

  <h1>Works Cited</h1>
  
  <div class="citation-list">
    <p class="citation-item">Name <em>Source </em>. Publisher, Year.</p>
  </div>

  <div class="footer">
    <p>Ancient Civilizations ABCs &copy; 2026 Benjamin Dong</p>
    <a href="#" class="nav-btn" style="margin-bottom: 0;">Top &uarr;</a>
  </div>

</body>
</html>
